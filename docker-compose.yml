services:
  logwise:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logwise
    ports:
      - "3000:3000"
    volumes:
      # Persist database data outside container
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOGWISE_PASSWORD=changeme
    restart: unless-stopped

# Development configuration (use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up)
